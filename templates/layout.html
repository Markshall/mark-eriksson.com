<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="%VITE_SITE_URL%{{path}}" />

    <meta property="og:title" content="{{ogTitle}}" />
    <meta property="og:type" content="{{ogType}}" />
    <meta property="og:url" content="%VITE_SITE_URL%{{path}}" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:image" content="%VITE_SITE_URL%{{ogImage}}" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {{{jsonLd}}}
    </script>

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Apply the saved or system theme before first paint to avoid a flash. -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("theme") ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch {}
    </script>

    <link rel="stylesheet" href="/styles/main.css" />
    <script type="module" src="{{script}}"></script>
  </head>

  <body>
    <header id="home" class="site-header wrap">
      <a href="/" class="brand" aria-label="Mark Eriksson, home">
        <svg aria-hidden="true" width="52" height="28" viewBox="0 0 130 70" shape-rendering="crispEdges">
          <path
            fill="currentColor"
            d="M0 0h10v70h-10z M10 10h10v10h-10z M20 20h10v10h-10z M30 30h10v10h-10z M40 20h10v10h-10z M50 10h10v10h-10z M60 0h10v70h-10z M70 0h30v10h-30z M70 30h20v10h-20z M70 60h30v10h-30z"
          />
          <path class="blink accent-fill" d="M110 60h20v10h-20z" />
        </svg>
        <span class="brand-name mono">Mark Eriksson</span>
      </a>

      <nav class="site-nav no-spy mono" aria-label="Main">
        <a href="/#resume">/résumé</a>
        <a href="/#projects">/projects</a>
        <a href="/notes/" data-notes-link>/notes</a>
        <a href="#contact">/contact</a>
        <a href="https://github.com/Markshall" target="_blank" rel="noopener noreferrer">
          github
          <span class="arrow-icon up-right" aria-hidden="true"></span>
        </a>
      </nav>

      <button
        type="button"
        class="icon-btn theme-toggle"
        data-theme-toggle
        aria-label="Switch to dark mode"
        aria-pressed="false"
      >
        <svg
          class="icon-sun"
          aria-hidden="true"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
        <svg
          class="icon-moon"
          aria-hidden="true"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>
    </header>

    {{{main}}}

    <footer id="contact" class="site-footer">
      <div class="wrap footer-main">
        <div class="contact">
          <p class="sign-off">Let’s build something<span class="accent">_</span></p>
          <a class="btn btn-solid mono" href="mailto:me@mark-eriksson.com">me@mark-eriksson.com</a>
        </div>
        <nav class="mono" aria-label="Social">
          <a href="https://github.com/Markshall" target="_blank" rel="noopener noreferrer">
            GitHub
            <span class="arrow-icon up-right" aria-hidden="true"></span>
          </a>
          <a href="/notes/" data-notes-link>Notes</a>
          <a href="https://codepen.io/Markshall" target="_blank" rel="noopener noreferrer">
            CodePen
            <span class="arrow-icon up-right" aria-hidden="true"></span>
          </a>
        </nav>
      </div>
      <div class="wrap footer-base mono">
        <span>© <span data-year>2026</span> Mark Eriksson</span>
        <span class="footer-links">
          <a href="/privacy/">privacy</a>
          <button type="button" class="link-btn" data-consent-open>cookie settings</button>
        </span>
        <a href="#home">
          back to top
          <span class="arrow-icon up" aria-hidden="true"></span>
        </a>
      </div>
    </footer>
  </body>
</html>
