name: Check

# Build, test and lint pull requests before they're merged. Runs on every PR (no
# paths filter) because format:check also covers the README and docs. Needs
# no secrets and never deploys.
on:
  pull_request:
    branches: [master]

concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run build

      # Smoke tests against the built site (tests/*.spec.ts), in the runner's
      # preinstalled Google Chrome.
      - run: npx playwright test

      # Audit the built pages with Lighthouse (lighthouserc.json): accessibility
      # must score 100, SEO 100 except on the noindex 404 page, and best
      # practices 95+. Performance only warns, because shared runners are noisy.
      # Run outside package.json because @lhci/cli's dependencies have open
      # npm audit advisories.
      - run: npx -y @lhci/cli@0.15.1 autorun

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
